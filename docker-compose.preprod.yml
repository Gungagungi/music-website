# Pre-production: a branch of the repository, deployed next to production on the
# same server, to try it out without running it on a workstation. See ADR-007.
#
#   npm run preprod:env               # .env.preprod, randomly drawn secrets
#   npm run preprod:deploy <branch>   # scripts/deployer-preprod.sh
#
# Do not run this file by hand from this checkout: the script does it from a
# dedicated worktree, checked out on the branch, and that worktree is the build
# context.
#
# Three differences from docker-compose.yml, each one intended:
#
# - E2E_TEST_MODE=1. The /api/test/* endpoints are open (behind their token),
#   so the Playwright suite can target pre-production. Matomo is absent by
#   default in this mode: the shop's analytics does not receive test visits.
# - No Caddy, no Matomo, no ntfy, no purge. The production Caddy also serves
#   this site, through the `fretline-edge` network; the database is reset on
#   every deployment, so retention has nothing to sweep.
# - Resource limits. This stack shares 2 vCPUs with the shop, whose measured
#   breaking point is CPU saturation: pre-production must cap out before it.

# A name distinct from `fretline` and `fretline-dev`: same reason as in the other
# two files, Compose would otherwise match services by name.
name: fretline-preprod

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  # Never `fretline-app:latest`, which is production's tag. A branch build would
  # overwrite it, and production's next `up` would start that branch, without
  # rebuilding anything and without any warning.
  image: fretline-app:preprod
  environment:
    DATABASE_URL: postgresql://fretline:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — npm run preprod:env}@db:5432/fretline
    AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required — npm run preprod:env}
    E2E_TEST_MODE: '1'
    TEST_API_TOKEN: ${TEST_API_TOKEN:?TEST_API_TOKEN is required — npm run preprod:env}

services:
  db:
    image: postgres:17-alpine
    # Same policy as `app`. When the server restarts, the Docker daemon restarts
    # the containers, not Compose: `depends_on` is not re-read, and a database
    # with `restart: no` let the application come back alone, without a database.
    restart: unless-stopped
    environment:
      POSTGRES_USER: fretline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — npm run preprod:env}
      POSTGRES_DB: fretline
    # Named volume rather than tmpfs: a tmpfs lives in RAM, and RAM is precisely
    # what this server lacks. The reset is done by the script
    # (`down --volumes`), not by the nature of the storage.
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fretline -d fretline']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *app
    command: ['node', 'app/dist/db/bootstrap.mjs']
    restart: 'no'
    # Same reason as in production: no HTTP server in this container.
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - '3000'
    cpus: '0.75'
    mem_limit: 512m
    networks:
      default:
      # The alias is what the Caddyfile targets. It is not enough on its own:
      # Docker always adds the service name, so this container also answers to
      # `app` on this network. That is why production announces itself there as
      # `prod-app` — without which Caddy serves one for the other.
      edge:
        aliases:
          - preprod-app

networks:
  edge:
    # Created by docker-compose.yml. External here: pre-production only makes
    # sense behind the production Caddy, and a missing network must stop the
    # deployment rather than create one nobody listens to.
    name: fretline-edge
    external: true

volumes:
  pgdata:
