# Full deployment: PostgreSQL, the application, a reverse proxy, the cart purge
# and analytics. Designed for a single VPS.
#
#   cp .env.production.example .env
#   $EDITOR .env                    # at least FRETLINE_DOMAIN, POSTGRES_PASSWORD,
#                                   AUTH_SECRET, MATOMO_DB_PASSWORD
#   docker compose up -d --build
#   ./scripts/verifier-deploiement.sh https://example.com
#
# On a development machine, this `.env` would collide with the test suite's
# own. Use `npm run prod:up` instead, which passes
# `--env-file .env.production` — see docs/deployment.md.
#
# No test-mode variable is defined here, and that is the first of the three
# guards that make /api/test/{reset,seed,state} unreachable: without
# E2E_TEST_MODE, these routes answer 404 before even looking at the token.

# Explicit project name. Without it, Compose derives it from the directory — the
# same for both files in this repository — and matches services by name: the
# production `db` would then silently recreate the development PostgreSQL
# container on the first command. Two distinct names give two sets of
# containers, volumes and networks that ignore each other.
name: fretline

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
    args:
      NEXT_PUBLIC_MATOMO_URL: ${NEXT_PUBLIC_MATOMO_URL:-}
      NEXT_PUBLIC_MATOMO_SITE_ID: ${NEXT_PUBLIC_MATOMO_SITE_ID:-}
  image: fretline-app:latest
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-fretline}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-fretline}
    AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required — openssl rand -base64 48}
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fretline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-fretline}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No published port: only containers on the compose network reach the
    # database. Backups go through `docker compose exec`, not the network.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-fretline} -d ${POSTGRES_DB:-fretline}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot service: migrates, then loads the catalogue if the database is
  # empty. The application waits for it to complete successfully. Migrations do
  # not run on app startup, otherwise two replicas would apply them
  # concurrently the day there are two.
  migrate:
    <<: *app
    command: ['node', 'app/dist/db/bootstrap.mjs']
    restart: 'no'
    # The image HEALTHCHECK queries the HTTP server, which this container does
    # not start. Without this exclusion it would stay `unhealthy` forever — a
    # false state that teaches people to stop looking at the column, and that
    # would keep `docker compose up --wait` spinning until its timeout.
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - '3000'
    networks:
      # L'alias que vise le Caddyfile, et non le nom de service `app`. Docker
      # ajoute toujours le nom de service comme alias, en plus de ceux qui sont
      # déclarés : le conteneur de pré-production, dont le service s'appelle
      # aussi `app`, répondait donc à ce nom sur `fretline-edge`, où Caddy est
      # branché. Caddy y résolvait `app` avant le réseau de cette pile, et la
      # boutique publique a servi la pré-production — en mode test, sur une base
      # remise à zéro à chaque déploiement de branche. `prod-app` n'existe que
      # sur ce réseau, où la pré-prod n'entre pas.
      default:
        aliases:
          - prod-app

  # Applies the cart retention policy (app/src/lib/retention.ts).
  #
  # A loop rather than pg_cron: the extension does not ship with the official
  # image and would require a custom Postgres image plus
  # shared_preload_libraries, for a job with nothing database-specific about
  # it. A loop in the existing application image reads in three lines,
  # restarts with everything else and runs exactly the code the suite tests.
  purge:
    <<: *app
    command:
      - sh
      - -c
      - 'while true; do node app/dist/db/purge.mjs || true; sleep "${PURGE_INTERVAL_SECONDS:-86400}"; done'
    # Same reason as for `migrate`: no HTTP server in this container.
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

  # --- Analytics ------------------------------------------------------------
  #
  # Matomo only accepts MySQL or MariaDB: the PostgreSQL `db` service above
  # cannot host it, hence a second DBMS. That is the price of Matomo, accepted
  # for its e-commerce tracking — Umami would have fit in the existing database
  # but cannot tie an order to a visit. See ADR-006.
  matomo-db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: matomo
      MARIADB_USER: matomo
      MARIADB_PASSWORD: ${MATOMO_DB_PASSWORD:?MATOMO_DB_PASSWORD is required}
      MARIADB_RANDOM_ROOT_PASSWORD: 'yes'
    volumes:
      - matomo-dbdata:/var/lib/mysql
    # No published port, same rule as `db`.
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  matomo:
    image: matomo:5-apache
    restart: unless-stopped
    environment:
      MATOMO_DATABASE_HOST: matomo-db
      MATOMO_DATABASE_ADAPTER: mysql
      MATOMO_DATABASE_USERNAME: matomo
      MATOMO_DATABASE_PASSWORD: ${MATOMO_DB_PASSWORD:?MATOMO_DB_PASSWORD is required}
      MATOMO_DATABASE_DBNAME: matomo
      # Without this, Matomo only sees the proxy's address and files every
      # visit under a single IP — the Caddy container's.
      MATOMO_GENERAL_PROXY_CLIENT_HEADERS: HTTP_X_FORWARDED_FOR
      MATOMO_GENERAL_PROXY_HOST_HEADERS: HTTP_X_FORWARDED_HOST
    volumes:
      - matomo-data:/var/www/html
    expose:
      - '80'
    depends_on:
      matomo-db:
        condition: service_healthy

  # --- Operations notifications ---------------------------------------------
  #
  # Receives the security audit alerts (scripts/notifier-audit.py).
  # Self-hosted rather than ntfy.sh: an alert's content is the list of unpatched
  # CVEs on this machine and the services it exposes, in other words a map of
  # what to attack. On the public server, a topic can be read without an
  # account by anyone who knows its name.
  #
  # This service is not part of the shop and nothing in the application calls
  # it: it lives here because Caddy, the certificates and the network already
  # do, and a second stack for a 20 MB container would cost more to maintain
  # than it is worth.
  ntfy:
    image: binwiederhier/ntfy:v2
    restart: unless-stopped
    command: ['serve']
    environment:
      # ntfy builds the URLs it publishes (subscription links, attachments)
      # from this base: without it, it announces its internal address,
      # unreachable from a phone.
      NTFY_BASE_URL: ${NTFY_BASE_URL:-http://localhost:8082}
      NTFY_BEHIND_PROXY: 'true'
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      # No account, no access: neither read nor write. This is the setting that
      # justifies self-hosting — leaving it at `read-write` would make the
      # server as public as ntfy.sh, and less well maintained.
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_ATTACHMENT_CACHE_DIR: ''
    volumes:
      - ntfy-data:/var/lib/ntfy
    expose:
      - '80'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Configurable host ports: on a server they are 80 and 443, but a local
    # trial runs into whatever already occupies them, and "the port is taken"
    # is a silly reason not to try out a stack before deploying it.
    ports:
      - '${FRETLINE_HTTP_PORT:-80}:80'
      - '${FRETLINE_HTTPS_PORT:-443}:443'
      - '${FRETLINE_HTTPS_PORT:-443}:443/udp'
      # Matomo without a domain name: Caddy then listens for it on 8081, in
      # plain HTTP, and that port has to be published to reach it. With a
      # domain set, Matomo is served on 443 like everything else and this
      # mapping carries nothing.
      #
      # On the loopback interface, not on 0.0.0.0. This port serves Matomo in
      # plain HTTP, and until the guided installation has been completed, the
      # first passer-by can finish it and become the administrator — of a PHP
      # application with full control over its database. From a remote
      # machine, use a tunnel: ssh -L 8081:localhost:8081 <server>
      - '127.0.0.1:${FRETLINE_ANALYTICS_PORT:-8081}:8081'
      # Same reason, same precaution as for Matomo: without a domain name, ntfy
      # is served in plain HTTP on 8082 and this port stays on loopback. A
      # notification server in plain HTTP on the outside would leak the
      # publishing token in clear text along with it.
      - '127.0.0.1:${FRETLINE_NTFY_PORT:-8082}:8082'
      # Pre-production without a domain name: same pattern, plain HTTP on
      # loopback. See docker-compose.preprod.yml.
      - '127.0.0.1:${FRETLINE_PREPROD_PORT:-8083}:8083'
    environment:
      FRETLINE_DOMAIN: ${FRETLINE_DOMAIN:?FRETLINE_DOMAIN is required}
      FRETLINE_NTFY_DOMAIN: ${FRETLINE_NTFY_DOMAIN:-:8082}
      # The Caddyfile only sees what it is given: without this line, the
      # `{$FRETLINE_ANALYTICS_DOMAIN}` of the analytics block would always fall
      # back to its default, and a domain set in .env would be silently ignored.
      FRETLINE_ANALYTICS_DOMAIN: ${FRETLINE_ANALYTICS_DOMAIN:-:8081}
      # Pre-production. The defaults are set here and not only in the
      # Caddyfile: Caddy only applies its own to an *unset* variable, and
      # Compose passes an empty one. An empty domain makes the whole
      # configuration fail — and takes the shop down with it. The default hash
      # is that of a randomly drawn, then discarded string: nobody gets in (`$$`
      # is Compose's escape for bcrypt's `$`).
      FRETLINE_PREPROD_DOMAIN: ${FRETLINE_PREPROD_DOMAIN:-:8083}
      PREPROD_BASIC_AUTH_USER: ${PREPROD_BASIC_AUTH_USER:-fretline}
      PREPROD_BASIC_AUTH_HASH: ${PREPROD_BASIC_AUTH_HASH:-$$2a$$14$$Bcoh63tinCQaAAH8qPR4teL49GuNTsmWW1dhmSueQ5xHWLqKMKI6e}
      PREPROD_ACCESS_KEY: ${PREPROD_ACCESS_KEY:-}
    networks:
      - default
      - edge
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Issued certificates live here. Without this volume, every redeployment
      # requests a new certificate and eventually hits Let's Encrypt's rate
      # limits.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
      - matomo
      - ntfy

networks:
  default:
  # The only bridge to pre-production (docker-compose.preprod.yml), which joins
  # it as an external network. Fixed name, since the other stack refers to it
  # by that name; created here rather than by hand, so that this stack starts
  # on its own — in CI as on a fresh server. Only Caddy is attached to it: the
  # production database stays out of reach of the pre-production containers.
  edge:
    name: fretline-edge

volumes:
  pgdata:
  caddy-data:
  caddy-config:
  # Matomo keeps its configuration and plugins in its own installation
  # directory: without this volume, every `up --build` would ask for the guided
  # installation again from scratch.
  matomo-data:
  matomo-dbdata:
  # ntfy's account database and publishing token, plus its message cache.
  # Without this volume, every restart would start again from `deny-all` with
  # no account: nobody could publish or read any more.
  ntfy-data:
