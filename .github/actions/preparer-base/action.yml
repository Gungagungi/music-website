name: Prepare the database
description: Applies the migrations and loads the seed data on the job's PostgreSQL service.

inputs:
  database-url:
    description: >-
      Connection string. It differs from job to job: a containerised job reaches
      the service by its name (`postgres`), a job on the host runner goes through
      the published port (`localhost`).
    required: true

runs:
  using: composite
  steps:
    # The service is declared with `--health-cmd pg_isready`, so GitHub already
    # waits for it to respond before running the first step. This wait covers the
    # remaining case: the server accepts connections but is still finishing its
    # initdb.
    - name: Wait for PostgreSQL
      shell: bash
      env:
        DATABASE_URL: ${{ inputs.database-url }}
        NODE_OPTIONS: --no-warnings
      run: |
        node -e '
          const { Client } = require("pg");
          const deadline = Date.now() + 60_000;
          (async () => {
            for (;;) {
              const client = new Client({ connectionString: process.env.DATABASE_URL });
              try {
                await client.connect();
                await client.end();
                return;
              } catch (error) {
                await client.end().catch(() => {});
                if (Date.now() > deadline) throw error;
                await new Promise((resolve) => setTimeout(resolve, 1000));
              }
            }
          })();
        '

    - name: Migrations
      shell: bash
      env:
        DATABASE_URL: ${{ inputs.database-url }}
      run: npm run db:migrate

    # Idempotent. Most jobs go over it again through POST /api/test/reset, but
    # the performance job does not run the `setup-db` project and needs a loaded
    # catalogue.
    - name: Seed data
      shell: bash
      env:
        DATABASE_URL: ${{ inputs.database-url }}
      run: npm run db:seed
