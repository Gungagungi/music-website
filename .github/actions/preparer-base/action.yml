name: Préparer la base
description: Applique les migrations et charge les graines sur le service PostgreSQL du job.

inputs:
  database-url:
    description: >-
      Chaîne de connexion. Elle diffère selon le job : un job conteneurisé rejoint
      le service par son nom (`postgres`), un job sur le runner hôte passe par le
      port publié (`localhost`).
    required: true

runs:
  using: composite
  steps:
    # Le service est déclaré `--health-cmd pg_isready`, donc GitHub attend déjà
    # qu'il réponde avant de lancer la première étape. Cette attente couvre le cas
    # restant : le serveur accepte les connexions mais termine encore son initdb.
    - name: Attendre PostgreSQL
      shell: bash
      env:
        DATABASE_URL: ${{ inputs.database-url }}
        NODE_OPTIONS: --no-warnings
      run: |
        node -e '
          const { Client } = require("pg");
          const deadline = Date.now() + 60_000;
          (async () => {
            for (;;) {
              const client = new Client({ connectionString: process.env.DATABASE_URL });
              try {
                await client.connect();
                await client.end();
                return;
              } catch (error) {
                await client.end().catch(() => {});
                if (Date.now() > deadline) throw error;
                await new Promise((resolve) => setTimeout(resolve, 1000));
              }
            }
          })();
        '

    - name: Migrations
      shell: bash
      env:
        DATABASE_URL: ${{ inputs.database-url }}
      run: npm run db:migrate

    # Idempotent. La plupart des jobs repassent derrière via POST /api/test/reset,
    # mais le job de performance ne lance pas le projet `setup-db` et a besoin
    # d'un catalogue chargé.
    - name: Graines
      shell: bash
      env:
        DATABASE_URL: ${{ inputs.database-url }}
      run: npm run db:seed
