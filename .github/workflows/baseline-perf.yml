name: Mesurer la baseline de performance

# Thresholds belong to the machine that compares against them.
#
# This repository's were first tuned on a VPS — the one of whoever wrote them.
# A shared GitHub runner is slower and above all more variable: a threshold
# brought in from elsewhere becomes either too loose to detect anything, or too
# tight to survive the neighbours. The README said so plainly, listing it among
# the accepted limitations.
#
# This workflow measures on the runner, writes `perf/baseline.json` and commits
# it back — the same principle as the visual baselines, applied to milliseconds
# rather than pixels.
#
#   Actions → Mesurer la baseline de performance → Run workflow → pick the branch
#
# Rerun it when the machine changes (runner image, PostgreSQL version), not on
# every code change: a baseline retaken on every commit endorses the slowness it
# is meant to detect.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baseline-perf-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  TEST_API_TOKEN: fretline-ci-token

jobs:
  mesurer:
    name: Mesurer et commiter
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fretline
          POSTGRES_PASSWORD: fretline
          POSTGRES_DB: fretline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fretline -d fretline"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://fretline:fretline@localhost:5432/fretline
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Production build
        run: npm run build

      - uses: ./.github/actions/preparer-base
        with:
          database-url: ${{ env.DATABASE_URL }}

      - uses: grafana/setup-k6-action@v1

      - name: Start the application
        run: |
          E2E_TEST_MODE=1 npm run start -w app &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health >/dev/null && exit 0
            sleep 1
          done
          echo "The application did not respond within the time limit." >&2
          exit 1

      # A dry run before measuring. The first seconds of a freshly started Next
      # process pay for filling the pool and compiling query plans; including
      # them would pin the baseline to a state the application only goes
      # through once.
      - name: Warm up
        run: K6_CALIBRATION=1 k6 run --vus 5 --duration 15s perf/smoke.js

      - name: Measure the smoke test
        run: K6_CALIBRATION=1 k6 run perf/smoke.js

      - name: Measure the load ramp-up
        run: K6_CALIBRATION=1 k6 run perf/load.js

      - name: Record the baseline
        env:
          RUNNER_DESCRIPTION: ${{ runner.os }} · ${{ runner.arch }} · GitHub-hosted runner
        run: node scripts/enregistrer-baseline.mjs smoke load

      - name: Upload the summaries for review
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: baseline-perf
          path: perf/results
          retention-days: 14

      - name: Commit if the baseline changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add perf/baseline.json

          if git diff --cached --quiet; then
            echo "The baseline is unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## 📈 Performance baseline updated"
            echo ""
            echo '```diff'
            git diff --cached -- perf/baseline.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          git commit -m "perf: measure the baseline on the CI runner"
          git push origin "HEAD:${GITHUB_REF_NAME}"
