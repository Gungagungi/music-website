name: Régénérer les baselines visuelles

# Reference screenshots belong to the environment that compares against them.
#
# A baseline produced on a development machine and compared in the CI container
# fails every time: fonts do not have exactly the same metrics from one system
# to another, every word shifts by a few pixels, and the diff reaches 6 % of the
# image without any regression having happened. Lowering the tolerance
# threshold to absorb the gap would make the suite blind to real regressions.
#
# The reference environment is therefore the CI container — the one that guards
# merges. This workflow regenerates the screenshots there and commits them back
# to the chosen branch. Run it after any intentional interface change.
#
#   Actions → Régénérer les baselines visuelles → Run workflow → pick the branch
#
# Then review the PNG diff like any other diff: a baseline accepted without
# being looked at turns visual regression into a formality.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baselines-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  TEST_API_TOKEN: fretline-ci-token

jobs:
  regenerer:
    name: Régénérer et commiter
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user root
    # The `visual` project depends on `setup-db`, hence on a database.
    # Containerised job: it reaches it by the service name, not through
    # localhost.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fretline
          POSTGRES_PASSWORD: fretline
          POSTGRES_DB: fretline
        options: >-
          --health-cmd "pg_isready -U fretline -d fretline"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://fretline:fretline@postgres:5432/fretline
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Production build
        run: npm run build -w app

      - uses: ./.github/actions/preparer-base
        with:
          database-url: ${{ env.DATABASE_URL }}

      - name: Regenerate reference screenshots
        working-directory: e2e
        env:
          HOME: /root
        run: npx playwright test --project=visual --update-snapshots

      - name: Upload screenshots for review
        uses: actions/upload-artifact@v7
        with:
          name: baselines-visuelles
          path: e2e/tests/visual/__screenshots__
          retention-days: 14

      - name: Commit if screenshots changed
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/tests/visual/__screenshots__

          if git diff --cached --quiet; then
            echo "No screenshot changed: the baselines are already up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## 📸 Baselines updated"
            echo ""
            git diff --cached --stat
          } >> "$GITHUB_STEP_SUMMARY"

          git commit -m "test(visual): regenerate the baselines in the CI environment"
          git push origin "HEAD:${GITHUB_REF_NAME}"
