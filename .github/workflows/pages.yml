name: Publier le rapport sur GitHub Pages

# Publie le rapport Playwright sur https://gungagungi.github.io/music-website/
# — un lien partageable, ce qu'un artifact de CI n'est pas.
#
# Le workflow relance sa propre suite plutôt que de réutiliser le rapport du
# nightly : les deux runs sont indépendants, et dépendre d'un artifact produit
# par un autre workflow ferait échouer la publication chaque fois que le nightly
# échoue — alors que publier un rapport rouge est précisément ce qu'on veut.
#
# La cadence est calée après le nightly pour ne pas se disputer les runners.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *' # 02:30 UTC, après le nightly

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  TEST_API_TOKEN: fretline-ci-token

jobs:
  publier:
    name: Générer et publier le rapport
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user root
    # Job conteneurisé : il joint la base par le nom du service, pas par
    # localhost, qui désignerait ici le conteneur du job lui-même.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fretline
          POSTGRES_PASSWORD: fretline
          POSTGRES_DB: fretline
        options: >-
          --health-cmd "pg_isready -U fretline -d fretline"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://fretline:fretline@postgres:5432/fretline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - run: npm run build -w app

      - uses: ./.github/actions/preparer-base
        with:
          database-url: ${{ env.DATABASE_URL }}

      # Une exécution par projet, et non les trois d'un coup.
      #
      # Les trois partagent une base — la même, puisqu'un seul service tourne
      # pour le job. Lancés ensemble, les commandes passées par la suite API
      # consomment du stock réel pendant que les specs UI le comptent : TC-025
      # attend 11 guitares électriques disponibles et en trouve 8. `ci.yml` ne
      # rencontre pas le défaut parce qu'il donne un job — donc une base — à
      # chaque projet.
      #
      # Séparer les exécutions rejoue `setup-db` à chaque fois, donc repart des
      # graines. Chacune nomme son blob : sans quoi les trois `report.zip`
      # s'écrasent et la fusion ne voit que le dernier.
      - name: Suite API
        working-directory: e2e
        continue-on-error: true
        env:
          HOME: /root
          PLAYWRIGHT_BLOB_OUTPUT_FILE: blob-report/report-api.zip
        run: npx playwright test --project=api

      - name: Suite UI (chromium)
        working-directory: e2e
        continue-on-error: true
        env:
          HOME: /root
          PLAYWRIGHT_BLOB_OUTPUT_FILE: blob-report/report-chromium.zip
        run: npx playwright test --project=chromium

      - name: Suite accessibilité
        working-directory: e2e
        continue-on-error: true
        env:
          HOME: /root
          PLAYWRIGHT_BLOB_OUTPUT_FILE: blob-report/report-a11y.zip
        run: npx playwright test --project=a11y

      # `continue-on-error` sur les trois suites, et c'est le fond du workflow :
      # il existe pour publier le rapport, rouge compris. Un échec de suite qui
      # interrompt la publication produit exactement ce que l'en-tête de ce
      # fichier dit vouloir éviter — plus de rapport le jour où il y aurait le
      # plus à lire dedans.
      - name: Fusionner en un rapport unique
        working-directory: e2e
        run: npx playwright merge-reports -c merge.config.ts ./blob-report

      # Le rapport Playwright à la racine, la documentation QA rendue sous /docs.
      # Elle était copiée en Markdown brut : le navigateur la télécharge ou
      # l'affiche en texte selon le type MIME deviné, et un tableau de
      # traçabilité de 139 lignes y devient illisible — précisément le document
      # qu'un lecteur extérieur vient voir.
      - name: Assembler le site
        run: |
          mkdir -p site
          cp -r e2e/reports/html/* site/
          node scripts/rendre-docs.mjs site/docs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploiement
        uses: actions/deploy-pages@v4
