name: Publier le rapport sur GitHub Pages

# Publishes the Playwright report at https://gungagungi.github.io/music-website/
# — a shareable link, which a CI artifact is not.
#
# The workflow reruns its own suite rather than reusing the nightly's report:
# the two runs are independent, and depending on an artifact produced by
# another workflow would make publishing fail every time the nightly fails —
# whereas publishing a red report is precisely what we want.
#
# The schedule sits after the nightly so the two do not compete for runners.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *' # 02:30 UTC, after the nightly

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  TEST_API_TOKEN: fretline-ci-token

jobs:
  publier:
    name: Générer et publier le rapport
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user root
    # Containerised job: it reaches the database by the service name, not
    # through localhost, which here would refer to the job's own container.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fretline
          POSTGRES_PASSWORD: fretline
          POSTGRES_DB: fretline
        options: >-
          --health-cmd "pg_isready -U fretline -d fretline"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://fretline:fretline@postgres:5432/fretline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - run: npm run build -w app

      - uses: ./.github/actions/preparer-base
        with:
          database-url: ${{ env.DATABASE_URL }}

      # One run per project, not all three at once.
      #
      # The three share a database — the same one, since a single service runs
      # for the job. Run together, the orders placed by the API suite consume
      # real stock while the UI specs count it: TC-025 expects 11 electric
      # guitars in stock and finds 8. `ci.yml` does not hit the defect because
      # it gives each project a job — and therefore a database.
      #
      # Separate runs replay `setup-db` each time, so they start again from the
      # seed data. Each one names its blob: otherwise the three `report.zip`
      # overwrite each other and the merge only sees the last one.
      - name: API suite
        working-directory: e2e
        continue-on-error: true
        env:
          HOME: /root
          PLAYWRIGHT_BLOB_OUTPUT_FILE: blob-report/report-api.zip
        run: npx playwright test --project=api

      - name: UI suite (chromium)
        working-directory: e2e
        continue-on-error: true
        env:
          HOME: /root
          PLAYWRIGHT_BLOB_OUTPUT_FILE: blob-report/report-chromium.zip
        run: npx playwright test --project=chromium

      - name: Accessibility suite
        working-directory: e2e
        continue-on-error: true
        env:
          HOME: /root
          PLAYWRIGHT_BLOB_OUTPUT_FILE: blob-report/report-a11y.zip
        run: npx playwright test --project=a11y

      # `continue-on-error` on all three suites, and that is the heart of the
      # workflow: it exists to publish the report, red included. A suite failure
      # that stops publishing produces exactly what this file's header says it
      # wants to avoid — no report on the day there would be the most to read
      # in it.
      - name: Merge into a single report
        working-directory: e2e
        run: npx playwright merge-reports -c merge.config.ts ./blob-report

      # The trend comes from the `historique-qa` branch, fed by the nightly.
      # Missing on the first run: the page then renders empty rather than
      # making publishing fail.
      - name: Fetch run history
        continue-on-error: true
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --depth=1 origin historique-qa && git show FETCH_HEAD:runs.jsonl > runs.jsonl

      # The Playwright report at the root, the QA documentation rendered under
      # /docs, the trend next to them. The documentation used to be copied as
      # raw Markdown: the browser downloads it or shows it as text depending on
      # the guessed MIME type, and a 139-row traceability table becomes
      # unreadable there — precisely the document an outside reader comes to see.
      - name: Assemble the site
        run: |
          mkdir -p site
          cp -r e2e/reports/html/* site/
          node scripts/rendre-docs.mjs site/docs
          node scripts/rendre-tendance.mjs runs.jsonl site/tendance.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploiement
        uses: actions/deploy-pages@v5
