name: Nightly

# The exhaustive run. Everything CI trims for speed happens here: the full
# regression on all three engines, and a real load test rather than a smoke.
# Scheduled rather than gating, because a two-hour feedback loop on a pull
# request is a feedback loop nobody uses.
on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC
  workflow_dispatch:

# The `rapport` job pushes a line to the `historique-qa` branch.
permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  TEST_API_TOKEN: fretline-ci-token

jobs:
  build:
    name: Build de production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: app-build
          path: app/.next
          retention-days: 1
          include-hidden-files: true

  regression-complete:
    name: Régression ${{ matrix.project }} (${{ matrix.shard }}/2)
    needs: build
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user root
    # Containerised job: it shares the services' network, so it reaches the
    # database by the service name (`postgres`) and not through localhost, which
    # here would refer to the job's own container.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fretline
          POSTGRES_PASSWORD: fretline
          POSTGRES_DB: fretline
        options: >-
          --health-cmd "pg_isready -U fretline -d fretline"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://fretline:fretline@postgres:5432/fretline
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: app-build
          path: app/.next

      - uses: ./.github/actions/preparer-base
        with:
          database-url: ${{ env.DATABASE_URL }}

      - name: Full suite
        working-directory: e2e
        env:
          PLAYWRIGHT_BLOB_OUTPUT_FILE: blob-report/report-${{ matrix.project }}-${{ matrix.shard }}.zip
          # Firefox will not launch as root unless $HOME is owned by root; the
          # container's default /github/home belongs to pwuser.
          HOME: /root
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-${{ matrix.project }}-${{ matrix.shard }}
          path: e2e/blob-report
          retention-days: 14

      # Failures *and* flaky tests: a test that passes on retry is the one that
      # will not reproduce locally, hence the one whose trace matters most.
      - name: Upload traces (failed and flaky)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: traces-${{ matrix.project }}-${{ matrix.shard }}
          path: e2e/test-results
          retention-days: 14
          if-no-files-found: ignore

  charge:
    name: Test de charge (50 VU)
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fretline
          POSTGRES_PASSWORD: fretline
          POSTGRES_DB: fretline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fretline -d fretline"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://fretline:fretline@localhost:5432/fretline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: app-build
          path: app/.next

      # This job does not run the `setup-db` project, so nothing will come
      # along afterwards to load the catalogue: the seed data laid down here is
      # what k6 measures.
      - uses: ./.github/actions/preparer-base
        with:
          database-url: ${{ env.DATABASE_URL }}

      - uses: grafana/setup-k6-action@v1

      - name: Start the application
        run: |
          E2E_TEST_MODE=1 npm run start -w app &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health >/dev/null && exit 0
            sleep 1
          done
          echo "The application did not respond within the time limit." >&2
          exit 1

      - name: Load ramp-up
        run: k6 run perf/load.js

      - name: Add the summary to the job
        if: ${{ !cancelled() }}
        run: cat perf/results/load.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: perf-load
          path: perf/results
          retention-days: 30

  rapport:
    name: Rapport consolidé
    needs: regression-complete
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          pattern: blob-*
          path: e2e/all-blobs
          merge-multiple: true

      - name: Merge into a single report
        working-directory: e2e
        run: npx playwright merge-reports -c merge.config.ts ./all-blobs

      - uses: actions/upload-artifact@v7
        with:
          name: rapport-nightly
          path: e2e/reports/html
          retention-days: 30

      # The history lives on an orphan branch, not on `main`: a line added every
      # night would bury the code's history there, and the data has nothing to do
      # with the state of the code at a given moment. Artifacts would not do
      # either — they expire, and a trend that loses its first three months no
      # longer says anything about the drift it is meant to show.
      - name: Record the run in the history
        # `!cancelled()` and not `success()`: a red run is exactly the one the
        # trend must keep. But a red run produces a summary, and a report that
        # was never produced produces none: without the test on the file, a
        # `download-artifact` failure made this step fail with "Summary not
        # found", and that second error — the most visible one in the job's
        # annotation — hid the real outage.
        if: ${{ !cancelled() && hashFiles('e2e/reports/summary.json') != '' }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # The branch may not exist on the first run: it is created as an orphan.
          if git ls-remote --exit-code --heads origin historique-qa >/dev/null 2>&1; then
            git fetch --depth=1 origin historique-qa
            git worktree add ../historique historique-qa
          else
            git worktree add --detach ../historique
            git -C ../historique checkout --orphan historique-qa
            git -C ../historique reset --hard
          fi

          node scripts/enregistrer-tendance.mjs e2e/reports/summary.json ../historique/runs.jsonl

          git -C ../historique add runs.jsonl
          git -C ../historique commit -m "chore(trend): run ${GITHUB_RUN_ID}"
          git -C ../historique push origin historique-qa
