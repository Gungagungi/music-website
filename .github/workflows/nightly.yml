name: Nightly

# The exhaustive run. Everything CI trims for speed happens here: the full
# regression on all three engines, and a real load test rather than a smoke.
# Scheduled rather than gating, because a two-hour feedback loop on a pull
# request is a feedback loop nobody uses.
on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC
  workflow_dispatch:

# Le job `rapport` pousse une ligne sur la branche `historique-qa`.
permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  TEST_API_TOKEN: fretline-ci-token

jobs:
  build:
    name: Build de production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: app-build
          path: app/.next
          retention-days: 1
          include-hidden-files: true

  regression-complete:
    name: Régression ${{ matrix.project }} (${{ matrix.shard }}/2)
    needs: build
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user root
    # Job conteneurisé : il partage le réseau des services, donc il joint la base
    # par le nom du service (`postgres`) et non par localhost, qui désignerait ici
    # le conteneur du job lui-même.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fretline
          POSTGRES_PASSWORD: fretline
          POSTGRES_DB: fretline
        options: >-
          --health-cmd "pg_isready -U fretline -d fretline"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://fretline:fretline@postgres:5432/fretline
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: app-build
          path: app/.next

      - uses: ./.github/actions/preparer-base
        with:
          database-url: ${{ env.DATABASE_URL }}

      - name: Suite complète
        working-directory: e2e
        env:
          PLAYWRIGHT_BLOB_OUTPUT_FILE: blob-report/report-${{ matrix.project }}-${{ matrix.shard }}.zip
          # Firefox will not launch as root unless $HOME is owned by root; the
          # container's default /github/home belongs to pwuser.
          HOME: /root
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-${{ matrix.project }}-${{ matrix.shard }}
          path: e2e/blob-report
          retention-days: 14

      # Échecs *et* instables : un test qui passe à la relance est celui qui ne
      # se reproduira pas en local, donc celui dont la trace compte le plus.
      - name: Publier les traces (échecs et instables)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: traces-${{ matrix.project }}-${{ matrix.shard }}
          path: e2e/test-results
          retention-days: 14
          if-no-files-found: ignore

  charge:
    name: Test de charge (50 VU)
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fretline
          POSTGRES_PASSWORD: fretline
          POSTGRES_DB: fretline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fretline -d fretline"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://fretline:fretline@localhost:5432/fretline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: app-build
          path: app/.next

      # Ce job ne lance pas le projet `setup-db`, donc rien ne repassera derrière
      # pour charger le catalogue : les graines posées ici sont celles que k6
      # mesure.
      - uses: ./.github/actions/preparer-base
        with:
          database-url: ${{ env.DATABASE_URL }}

      - uses: grafana/setup-k6-action@v1

      - name: Démarrer l’application
        run: |
          E2E_TEST_MODE=1 npm run start -w app &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health >/dev/null && exit 0
            sleep 1
          done
          echo "L’application n’a pas répondu dans le délai imparti." >&2
          exit 1

      - name: Montée en charge
        run: k6 run perf/load.js

      - name: Ajouter le résumé au job
        if: ${{ !cancelled() }}
        run: cat perf/results/load.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: perf-load
          path: perf/results
          retention-days: 30

  rapport:
    name: Rapport consolidé
    needs: regression-complete
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          pattern: blob-*
          path: e2e/all-blobs
          merge-multiple: true

      - name: Fusionner en un rapport unique
        working-directory: e2e
        run: npx playwright merge-reports -c merge.config.ts ./all-blobs

      - uses: actions/upload-artifact@v7
        with:
          name: rapport-nightly
          path: e2e/reports/html
          retention-days: 30

      # L'historique vit sur une branche orpheline, pas sur `main` : une ligne
      # ajoutée chaque nuit y noierait l'historique du code, et la donnée n'a
      # aucun rapport avec un état du code à un instant donné. Les artifacts ne
      # conviendraient pas non plus — ils expirent, et une tendance qui perd ses
      # trois premiers mois ne dit plus rien de la dérive qu'elle sert à voir.
      - name: Enregistrer le run dans l’historique
        # `!cancelled()` et non `success()` : un run rouge est exactement celui
        # que la tendance doit garder. Mais un run rouge produit un résumé, et
        # un rapport non produit n'en produit aucun : sans le test sur le
        # fichier, un échec de `download-artifact` faisait échouer cette étape
        # sur « Résumé introuvable », et cette seconde erreur — la plus visible
        # dans l'annotation du job — masquait la vraie panne.
        if: ${{ !cancelled() && hashFiles('e2e/reports/summary.json') != '' }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # La branche peut ne pas exister au premier run : on la crée orpheline.
          if git ls-remote --exit-code --heads origin historique-qa >/dev/null 2>&1; then
            git fetch --depth=1 origin historique-qa
            git worktree add ../historique historique-qa
          else
            git worktree add --detach ../historique
            git -C ../historique checkout --orphan historique-qa
            git -C ../historique reset --hard
          fi

          node scripts/enregistrer-tendance.mjs e2e/reports/summary.json ../historique/runs.jsonl

          git -C ../historique add runs.jsonl
          git -C ../historique commit -m "chore(tendance): run ${GITHUB_RUN_ID}"
          git -C ../historique push origin historique-qa
