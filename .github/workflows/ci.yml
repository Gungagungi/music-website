name: CI

# Gate every push and pull request. The split between this workflow and
# nightly.yml is deliberate: this one has to stay fast enough that nobody is
# tempted to merge without it, so it runs the full regression on one engine and
# only the smoke set on the other two. The exhaustive matrix runs at night.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The Playwright container tag must match the @playwright/test version in
# e2e/package.json — the image ships browser binaries built for that exact
# release, and a mismatch fails at launch. It cannot be templated from `env`
# because `container.image` is evaluated before the env context exists.
env:
  NODE_VERSION: '22'
  TEST_API_TOKEN: fretline-ci-token

jobs:
  qualite:
    name: Qualité & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # Two seconds, no database: the only tests in the repository that talk
      # directly to a function. They hold the monetary arithmetic, which the
      # Playwright suite can only exercise through a whole cart.
      - name: Unit tests
        run: npm run test:unit

      # The matrix and the CSV are derived from the specs' annotations. Without
      # this guard, they stay committed in a state describing a suite that no
      # longer exists — worse than missing, since people keep relying on them.
      - name: Check generated traceability
        working-directory: e2e
        run: npm run trace:check

      # Same rule as the matrix: the specification is derived from the schemas
      # the API suite validates, never written alongside. A spec no test goes
      # through describes an intention, not an API.
      - name: Check OpenAPI specification
        working-directory: e2e
        run: npm run openapi:check

      # An empty facet does not turn the suite red, it turns it empty: TC-215
      # iterates over the filter's results, which holds true for any empty list.
      # The test would stay green with zero coverage.
      - name: Check catalogue invariants
        run: npm run check:catalog

      - name: Production build
        run: npm run build

      # The application is built once and shared with every test job. Rebuilding
      # it six times would add minutes to the pipeline and, worse, let the jobs
      # disagree about what they are testing.
      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: app-build
          path: app/.next
          retention-days: 1
          include-hidden-files: true

  tests-api:
    name: Tests API
    needs: qualite
    runs-on: ubuntu-latest
    # Job on the host runner: the service publishes its port and is reached
    # through localhost. The containerised jobs below go through the service
    # name instead — that is the difference not to mix up.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fretline
          POSTGRES_PASSWORD: fretline
          POSTGRES_DB: fretline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fretline -d fretline"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://fretline:fretline@localhost:5432/fretline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: app-build
          path: app/.next

      - uses: ./.github/actions/preparer-base
        with:
          database-url: ${{ env.DATABASE_URL }}

      # No browser is involved: the API project only uses the request fixture,
      # which is why this job reports in well under a minute.
      #
      # Each job also names its own blob file. Playwright defaults to
      # `report.zip` for an unsharded run, so several jobs merging into one
      # directory would silently overwrite each other and the consolidated
      # report would be missing whole suites.
      - name: API suite
        working-directory: e2e
        env:
          PLAYWRIGHT_BLOB_OUTPUT_FILE: blob-report/report-api.zip
        run: npx playwright test --project=api

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-api
          path: e2e/blob-report
          retention-days: 7

  mutation:
    name: Tests de mutation (arithmétique monétaire)
    needs: qualite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # The threshold is 100 % on this scope: the job fails as soon as a mutant
      # survives. That is what separates a measurement from a gate — a score
      # that is merely published drifts down without anyone finding out.
      - name: Mutants
        run: npm run test:mutation

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: rapport-mutation
          path: app/reports/mutation
          retention-days: 7

  tests-ui:
    name: UI ${{ matrix.project }}${{ matrix.shard && format(' ({0}/{1})', matrix.shard, matrix.shards) || '' }}
    needs: qualite
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user root
    # Containerised job: it shares the services' network, so it reaches the
    # database by the service name (`postgres`) and not through localhost, which
    # here would refer to the job's own container.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fretline
          POSTGRES_PASSWORD: fretline
          POSTGRES_DB: fretline
        options: >-
          --health-cmd "pg_isready -U fretline -d fretline"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://fretline:fretline@postgres:5432/fretline
    strategy:
      fail-fast: false
      matrix:
        include:
          # Chromium carries the full regression, sharded three ways.
          - project: chromium
            shard: 1
            shards: 3
            grep: ''
          - project: chromium
            shard: 2
            shards: 3
            grep: ''
          - project: chromium
            shard: 3
            shards: 3
            grep: ''
          # Firefox and WebKit run the smoke set only. They exist to catch
          # engine-specific breakage — and they have already earned their place:
          # a hydration race and an aborted navigation only ever showed up here.
          - project: firefox
            grep: '--grep @smoke'
          - project: webkit
            grep: '--grep @smoke'
          - project: mobile-chrome
            grep: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: app-build
          path: app/.next

      - uses: ./.github/actions/preparer-base
        with:
          database-url: ${{ env.DATABASE_URL }}

      - name: UI suite
        working-directory: e2e
        env:
          PLAYWRIGHT_BLOB_OUTPUT_FILE: blob-report/report-${{ matrix.project }}-${{ matrix.shard || 'all' }}.zip
          # Firefox refuses to start as root when $HOME belongs to someone else,
          # and the container's default $HOME (/github/home) is owned by pwuser.
          # Chromium and WebKit do not care; Firefox fails at launch, before a
          # single test runs.
          HOME: /root
        run: |
          npx playwright test --project=${{ matrix.project }} ${{ matrix.grep }} \
            ${{ matrix.shard && format('--shard={0}/{1}', matrix.shard, matrix.shards) || '' }}

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-ui-${{ matrix.project }}-${{ matrix.shard || 'all' }}
          path: e2e/blob-report
          retention-days: 7

      # Traces are the reason a failure can be diagnosed without reproducing it
      # locally — and a flaky test is precisely the one that will not reproduce.
      # Uploading only on failure throws away the evidence for every test that
      # passed on retry, which is how a race survives three pipelines in a row.
      # `test-results` only holds artifacts for runs that failed at least once,
      # so a fully green job uploads nothing.
      - name: Upload traces (failed and flaky)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: traces-${{ matrix.project }}-${{ matrix.shard || 'all' }}
          path: e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

  tests-a11y:
    name: Accessibilité
    needs: qualite
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user root
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fretline
          POSTGRES_PASSWORD: fretline
          POSTGRES_DB: fretline
        options: >-
          --health-cmd "pg_isready -U fretline -d fretline"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://fretline:fretline@postgres:5432/fretline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: app-build
          path: app/.next

      - uses: ./.github/actions/preparer-base
        with:
          database-url: ${{ env.DATABASE_URL }}

      - name: axe-core scans (WCAG 2.1 AA)
        working-directory: e2e
        env:
          PLAYWRIGHT_BLOB_OUTPUT_FILE: blob-report/report-a11y.zip
          HOME: /root
        run: npx playwright test --project=a11y

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-a11y
          path: e2e/blob-report
          retention-days: 7

  tests-visual:
    name: Régression visuelle
    needs: qualite
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user root
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fretline
          POSTGRES_PASSWORD: fretline
          POSTGRES_DB: fretline
        options: >-
          --health-cmd "pg_isready -U fretline -d fretline"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://fretline:fretline@postgres:5432/fretline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: app-build
          path: app/.next

      - uses: ./.github/actions/preparer-base
        with:
          database-url: ${{ env.DATABASE_URL }}

      - name: Compare against baselines
        working-directory: e2e
        env:
          PLAYWRIGHT_BLOB_OUTPUT_FILE: blob-report/report-visual.zip
          HOME: /root
        run: npx playwright test --project=visual

      # The diff images are the whole point of a failed visual run: without them
      # the reviewer has a percentage and no way to judge it.
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diffs-visuels
          path: e2e/test-results
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-visual
          path: e2e/blob-report
          retention-days: 7

  perf-smoke:
    name: Performance (smoke)
    needs: qualite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fretline
          POSTGRES_PASSWORD: fretline
          POSTGRES_DB: fretline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fretline -d fretline"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://fretline:fretline@localhost:5432/fretline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: app-build
          path: app/.next

      # This job does not run the `setup-db` project, so nothing will come
      # along afterwards to load the catalogue: the seed data laid down here is
      # what k6 measures.
      - uses: ./.github/actions/preparer-base
        with:
          database-url: ${{ env.DATABASE_URL }}

      - uses: grafana/setup-k6-action@v1

      - name: Start the application
        run: |
          E2E_TEST_MODE=1 npm run start -w app &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health >/dev/null && exit 0
            sleep 1
          done
          echo "The application did not respond within the time limit." >&2
          exit 1

      - name: Load smoke test (10 VUs / 30 s)
        run: k6 run perf/smoke.js

      - name: Add the summary to the job
        if: ${{ !cancelled() }}
        run: cat perf/results/smoke.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: perf-smoke
          path: perf/results
          retention-days: 7

  demo-defauts:
    name: Démonstration — détection des défauts
    needs: qualite
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user root
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fretline
          POSTGRES_PASSWORD: fretline
          POSTGRES_DB: fretline
        options: >-
          --health-cmd "pg_isready -U fretline -d fretline"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://fretline:fretline@postgres:5432/fretline
    # The *step* is expected to fail here, not the job: this runs the
    # application with its three seeded defects enabled and asserts that the
    # suite still catches them. The job goes green when detection works, which
    # makes it a real gate on coverage rather than decoration.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # Rebuilt on purpose: one of the three defects lives in a client component,
      # so it is baked in at build time through NEXT_PUBLIC_SEED_BUGS.
      - name: Build with defects enabled
        env:
          SEED_BUGS: '1'
          NEXT_PUBLIC_SEED_BUGS: '1'
        run: npm run build -w app

      - uses: ./.github/actions/preparer-base
        with:
          database-url: ${{ env.DATABASE_URL }}

      - name: The suite must detect all three defects
        id: detection
        continue-on-error: true
        working-directory: e2e
        env:
          SEED_BUGS: '1'
          NEXT_PUBLIC_SEED_BUGS: '1'
          HOME: /root
        run: npx playwright test --project=chromium --grep @known-bug

      - name: Check that detection actually happened
        run: |
          if [ "${{ steps.detection.outcome }}" = "failure" ]; then
            {
              echo "## ✅ Defects detected"
              echo ""
              echo "The suite failed as expected on the \`SEED_BUGS=1\` build: all three deliberate defects are detected."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## ❌ Defects not detected"
              echo ""
              echo "The suite went green on the defective build: coverage has regressed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  deploiement:
    name: Image et pile de production
    runs-on: ubuntu-latest
    # Independent of `qualite`: this job consumes no artifact, it rebuilds
    # everything inside the image. It is the only place where the Dockerfile,
    # the compose file and the Caddyfile are executed before a real deployment —
    # without it, they rot silently and nobody finds out until a release night.
    steps:
      - uses: actions/checkout@v7

      # Through the repository's generator, not an `openssl rand` copied here.
      # The first version copied it in base64, whose alphabet contains `/`: that
      # character ends DATABASE_URL's authority section, and the job failed
      # about one time in three. The rule "this password must go through a URL"
      # lives in a single file; this job must read it there.
      - name: Configure the stack
        run: |
          node scripts/preparer-env.mjs --production --domain=:80
          cp .env.production .env

      - name: Build the image and start the stack
        run: docker compose up -d --build

      - name: Wait for the site to respond
        run: |
          for _ in $(seq 1 90); do
            curl -sf http://localhost/api/health >/dev/null && exit 0
            sleep 2
          done
          echo "The stack did not respond within the time limit." >&2
          exit 1

      # The same checks as those run after a real deployment, on the same
      # artefacts. The most important one is that /api/test/* answers 404: these
      # routes wipe the database, and nothing in the interface signals that they
      # are open.
      #
      # Without an argument, rather than a hard-coded http://localhost: the
      # script derives the URL from FRETLINE_DOMAIN in .env.production, generated
      # just above with --domain=:80. A hard-coded call gave the same result
      # today, but for a reason nothing guaranteed — changing the domain in the
      # "Configure the stack" step without touching this one would have checked
      # the wrong URL silently.
      - name: Post-deployment checks
        run: ./scripts/verifier-deploiement.sh

      # The command is the `migrate` service's, run again by hand: it must be
      # replayable with no effect, otherwise every site update is a gamble.
      - name: Database preparation must be replayable
        run: |
          docker compose run --rm migrate 2>&1 | tee /tmp/rejeu.log
          grep -q 'database already populated' /tmp/rejeu.log

      # REQ-DATA-05. The only check the Playwright suite cannot carry — it cannot
      # restart the server it is talking to — and the one that justifies the
      # whole migration: an order placed before the shutdown must be readable
      # after it.
      - name: Data must survive a full shutdown
        run: ./scripts/verifier-persistance.sh http://localhost

      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  rapport:
    name: Rapport consolidé
    needs: [tests-api, tests-ui, tests-a11y, tests-visual]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Download partial reports
        uses: actions/download-artifact@v8
        with:
          pattern: blob-*
          path: e2e/all-blobs
          merge-multiple: true

      # Every shard and project emits a blob; merging them is what turns eight
      # partial runs into one report a human can read.
      #
      # `-c merge.config.ts` is not optional: half these blobs come from the
      # container (checkout at /__w/...) and half from the runner host
      # (/home/runner/work/...), and merge-reports refuses two testDirs unless
      # a config names the canonical one.
      - name: Merge into a single report
        working-directory: e2e
        run: npx playwright merge-reports -c merge.config.ts ./all-blobs

      - name: Upload the HTML report
        uses: actions/upload-artifact@v7
        with:
          name: rapport-playwright
          path: e2e/reports/html
          retention-days: 30
