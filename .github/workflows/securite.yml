# Repository side of the security audit.
#
# The machine side — sshd, nftables, secret permissions, listening ports — cannot
# live here: a GitHub runner has no access to the VPS. It is handled by a systemd
# timer on the server (scripts/systemd/audit-securite.timer). This workflow
# covers what a runner can actually see: dependencies, committed secrets, the
# stack's images, and the public target's headers.
#
# Weekly cadence rather than on every PR, and that is deliberate: CVE databases
# move without the repository moving, so the relevant deadline is the calendar,
# not the commit. The dependency check, however, also runs on PRs that touch the
# npm lockfile, because there it really is the diff that changes the risk.

name: Sécurité

on:
  schedule:
    # Monday 05:00 UTC — after the VPS daily timer, whose overnight report is
    # then already available for comparison.
    - cron: '0 5 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'package-lock.json'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'Caddyfile'
      - 'scripts/audit-securite.py'
      - '.github/workflows/securite.yml'

permissions:
  contents: read

jobs:
  dependances:
    name: Dépendances et secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the committed-secrets check only judges HEAD's
          # content, but a useful diagnosis needs to be able to trace back to
          # the offending commit without re-cloning.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # `--omit=dev`: development dependencies are never deployed. Mixing them
      # in would bury the signal under test tooling, and a report people get
      # used to skimming no longer protects anything.
      - name: Production dependency CVEs
        run: npm audit --omit=dev --audit-level=high

      - name: Audit repository checks
        run: python3 scripts/audit-securite.py --familles depot --seuil eleve

  images:
    name: CVE des images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The application image is built here rather than pulled from a registry:
      # the repository publishes none, and scanning the image the current
      # Dockerfile produces is the question we care about anyway.
      - name: Build the application image
        run: docker build -t fretline-app:audit .

      - name: Scan the application image
        # Not just "a newer version": up to v0.28.0 the action called
        # `setup-trivy` by a tag (`v0.2.1`) since deleted upstream, which breaks
        # it retroactively without any commit here changing. Recent versions
        # pin that dependency by commit hash.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fretline-app:audit
          severity: 'HIGH,CRITICAL'
          # A CVE with no published fix calls for no action: reporting it on
          # every run trains people to ignore the whole report.
          ignore-unfixed: true
          exit-code: '1'
          scanners: vuln

      # Third-party images are updated by bumping their tag, and nothing in this
      # repository says when that became necessary. They do not block the job:
      # their fix is a redeployment, not a code change, so turning red here
      # would only train people to ignore a check.
      - name: Scan third-party images
        continue-on-error: true
        run: |
          set -u
          for image in postgres:17-alpine mariadb:11 matomo:5-apache caddy:2-alpine; do
            echo "::group::$image"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:latest image \
              --severity HIGH,CRITICAL --ignore-unfixed --scanners vuln \
              --quiet "$image" || true
            echo "::endgroup::"
          done

  fin-de-support:
    name: Fin de support
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No dependency: the check reads the compose file, the Dockerfile and
      # app/package.json, then queries endoflife.date. It is the only job in
      # this workflow that needs neither npm nor Docker, and also the one that
      # best justifies the weekly cadence — end of support arrives on a date,
      # not with a commit.
      #
      # `--seuil eleve`: the job turns red on an already dead cycle, not on a
      # deadline 90 days away, which can be planned without stopping the line.
      - name: Support cycles of deployed components
        run: |
          python3 scripts/audit-securite.py \
            --familles eol \
            --seuil eleve \
            --format texte

  cible:
    name: Cible publique
    runs-on: ubuntu-latest
    # Without the deployment's address, there is nothing to probe — and a job
    # that succeeds for lack of doing anything is worse than no job at all.
    if: vars.FRETLINE_URL != ''
    steps:
      - uses: actions/checkout@v4

      - name: Headers, TLS, test endpoints
        run: |
          python3 scripts/audit-securite.py \
            --familles web \
            --cible "${{ vars.FRETLINE_URL }}" \
            --seuil eleve \
            --format texte
