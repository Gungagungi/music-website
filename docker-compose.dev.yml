# PostgreSQL only, for development and running the test suite locally.
#
# The application runs natively (`npm run dev` or `npm run start -w app`):
# rebuilding it in a container on every change would cost far more than the
# isolation brings here. The full deployment is in docker-compose.yml.
#
#   docker compose -f docker-compose.dev.yml up -d --wait
#   npm run db:migrate && npm run db:seed

# See docker-compose.yml: both files must carry distinct project names,
# otherwise Compose mixes up their `db` services.
name: fretline-dev

services:
  db:
    image: postgres:17-alpine
    container_name: fretline-db-dev
    environment:
      POSTGRES_USER: fretline
      POSTGRES_PASSWORD: fretline
      POSTGRES_DB: fretline
      # The data is disposable and reloaded from the seed data: durability is
      # traded for speed, which makes `db:reset` noticeably faster. Never carry
      # this over to production.
      POSTGRES_INITDB_ARGS: '--data-checksums'
    command: >
      postgres
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off
    # Bound to loopback: the default port published the database on the
    # machine's public IP, `fretline` password included. Nothing outside the
    # host needs this database — the development application runs natively
    # alongside it.
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - fretline-pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fretline -d fretline']
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

volumes:
  fretline-pgdata-dev:
